<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Molyuu's Redirect Page</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        .container {
            width: min(100%, 500px);
            max-width: 500px;
            margin: 26px auto;
            padding: 20px;
            text-align: center;
            border: 2px solid #8e44ad;
            /* Replace with the function below */
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            background-color: #fff;
        }

        h1 {
            text-align: center;
            color: #55ad44;
            /* Replace with the function below */
        }

        ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        li {
            margin: 10px 0;
        }

        a {
            display: inline-block;
            padding: 8px 12px;
            text-decoration: none;
            color: #8e44ad;
            font-weight: bold;
        }

        a:hover {
            color: #6c3483;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                margin: 12px auto;
                padding: 24px 16px;
            }

            h1 {
                font-size: clamp(1.5rem, 8vw, 2rem);
                line-height: 1.2;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1> Molyuu's Redirect Page </h1>
        <p> </p>
        <p>Find me at:</p>
        <ul>
            <a href="https://github.com/Molyuu" target="_blank">GitHub</a>
            <a href="mailto:mi@molyuu.cyou" target="_blank">E-Mail</a>
        </ul>
        <p>Visit my websites:</p>
        <a href="https://molyuu.cyou/" target="_blank">Homepage</a>
        <a href="https://blog.molyuu.cyou/" target="_blank">Blog</a>
    </div>

    <script>
        const container = document.querySelector('.container');
        const heading = document.querySelector('h1');
        const colors = ['#ff0000', '#2bff00'];
        let colorIndex = 0;

        // Apply the initial color immediately.
        function designerFriendHappy() {
            const color = colors[colorIndex];
            container.style.borderColor = color;
            heading.style.color = color;
            container.style.transform = `scale(${colorIndex === 0 ? 1.04 : 1})`;
        }

        designerFriendHappy();

        // Toggle a deterministic state every 150 ms. Using Date.now() here
        // could select the same color twice when a timer fires slightly early
        // or late, which made the animation look uneven.
        window.setInterval(() => {
            colorIndex = (colorIndex + 1) % colors.length;
            designerFriendHappy();
        }, 150);
    </script>
</body>

</html>
